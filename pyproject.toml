[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthrel"
version = "0.1.0"
description = "Synthetic Relational Data Generator for DBMS Stress-Testing with Referential and Temporal Integrity"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Diploma Student" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "networkx>=3.2.1",
    "numpy>=1.26.4",
    "mimesis>=18.0.0",
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "typer>=0.12.3",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
synthrel = "synthrel.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
